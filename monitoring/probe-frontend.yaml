apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: boutique-frontend
  namespace: monitoring
spec:
  jobName: boutique-frontend
  interval: 15s
  module: http_2xx
  prober:
    url: blackbox-prometheus-blackbox-exporter.monitoring.svc:9115
  targets:
    staticConfig:
      static:
        - http://frontend.boutique.svc.cluster.local
