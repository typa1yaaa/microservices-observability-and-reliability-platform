apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: boutique-slo
  namespace: monitoring
  labels:
    release: kps
spec:
  groups:

    - name: boutique-sli
      rules:
        - record: boutique:error_ratio:5m
          expr: 1 - avg_over_time(probe_success{job="boutique-frontend"}[5m])
        - record: boutique:error_ratio:30m
          expr: 1 - avg_over_time(probe_success{job="boutique-frontend"}[30m])
        - record: boutique:error_ratio:1h
          expr: 1 - avg_over_time(probe_success{job="boutique-frontend"}[1h])
        - record: boutique:error_ratio:6h
          expr: 1 - avg_over_time(probe_success{job="boutique-frontend"}[6h])

    - name: boutique-slo-alerts
      rules:
        - alert: BoutiqueFastBurn
          expr: |
            boutique:error_ratio:1h > (14.4 * 0.01)
            and
            boutique:error_ratio:5m > (14.4 * 0.01)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Быстрый расход бюджета ошибок витрины"
            description: "Доля ошибок за 1ч {{ $value | humanizePercentage }}."
            runbook: "https://github.com/typa1yaaa/microservices-observability-and-reliability-platform/blob/main/docs/runbooks/frontend-down.md"
        
        - alert: BoutiqueSlowBurn
          expr: |
            boutique:error_ratio:6h > (6 * 0.01)
            and
            boutique:error_ratio:30m > (6 * 0.01)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Медленный расход бюджета ошибок витрины"
            description: "Доля ошибок за 6ч {{ $value | humanizePercentage }}."
            runbook: "https://github.com/typa1yaaa/microservices-observability-and-reliability-platform/blob/main/docs/runbooks/frontend-down.md"
      
        - alert: BoutiqueSlowResponse
          expr: quantile_over_time(0.95, probe_duration_seconds{job="boutique-frontend"}[5m]) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "p95 времени ответа витрины больше 1 секунды"
            description: "p95 = {{ $value | humanizeDuration }}."
            runbook: "https://github.com/typa1yaaa/microservices-observability-and-reliability-platform/blob/main/docs/runbooks/slow-response.md"

        - alert: BoutiqueJourneyFailing
          expr: |
            sum(rate(journey_runs_total{result="failure"}[5m]))
              / sum(rate(journey_runs_total[5m])) > 0.2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Пользовательский сценарий покупки падает"
            description: "Доля неуспешных прогонов {{ $value | humanizePercentage }}. Проверьте метрику journey_step_failures_total по шагам."
            runbook: "https://github.com/typa1yaaa/microservices-observability-and-reliability-platform/blob/main/docs/runbooks/journey-failing.md"

        - alert: JourneyExporterDown
          expr: absent(journey_runs_total)
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "journey-exporter не отдает метрики"
            description: "Синтетический мониторинг не работает, алерты по сценарию не сработают."
            runbook: "https://github.com/typa1yaaa/microservices-observability-and-reliability-platform/blob/main/docs/runbooks/journey-exporter-down.md"
        
        - alert: K8sDeploymentStuck
          expr: kube_deployment_status_replicas_unavailable{namespace="boutique"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Деплой {{ $labels.deployment }} застрял"
            description: "Недоступные реплики: {{ $value }}. Проверьте ImagePullBackOff, OOMKilled или CrashLoopBackOff."
            runbook: "https://github.com/typa1yaaa/microservices-observability-and-reliability-platform/blob/main/docs/runbooks/deployment-stuck.md"